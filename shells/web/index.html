<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/images/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wufour Maps">
  <title>Wufour Maps</title>
  <style>
    /* Fonts zui uses for text (the same stack as Maps-js). Everything else is drawn by zui. */
    :root {
      --zui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans Arabic", Tahoma, sans-serif;
      --zui-mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }
    html, body { margin: 0; height: 100%; }
    body { font-family: var(--zui-font); -webkit-text-size-adjust: 100%; }
  </style>
</head>
<body>
  <script type="module">
    import { start } from '/zui.js';
    // With the #zoom/lat/lng map position, which the app keeps up to date.
    start('/app.wasm', document.body, { link: location.pathname + location.search + location.hash });
  </script>
  <script>
    // Installable, and opens offline with the areas already viewed (not inside an embed).
    if ('serviceWorker' in navigator && !location.pathname.startsWith('/embed/')) {
      addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
