<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Wufour Maps</title>
    <link rel="icon" href="/assets/images/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.json">
    <!-- Shown by the service worker when a page that was never opened on this device is requested offline. -->
    <style>
        html, body { margin: 0; height: 100%; }
        body { display: grid; place-items: center; background: #ffffff; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .offline { box-sizing: border-box; width: 100%; max-width: 380px; padding: 32px 24px; text-align: center; }
        .offline img { width: 72px; height: 72px; }
        .offline h1 { margin: 18px 0 8px; font-size: 24px; letter-spacing: -0.5px; }
        .offline p { margin: 0 0 24px; line-height: 1.55; opacity: 0.7; }
        .offline a { display: inline-block; padding: 12px 28px; border-radius: 999px; background: #2563eb; color: #ffffff; font-weight: 600; text-decoration: none; margin: 4px; }
        .offline a.secondary { background: transparent; color: #2563eb; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08); }
    </style>
</head>
<body>
    <div class="offline">
        <img src="/assets/images/icon.svg" alt="">
        <h1>You are offline</h1>
        <p>This page cannot open without a connection. The map opens offline, with the areas you already viewed.</p>
        <a href="">Try again</a>
        <a class="secondary" href="/">Open the map</a>
    </div>
    <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
